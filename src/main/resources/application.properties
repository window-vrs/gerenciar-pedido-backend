spring.application.name=gerenciar-pedido

server.servlet.context-path=/gerenciar-pedido/api/v1
server.port=${SERVER_HOST_PORT:8080}

#DB_HOST=host.docker.internal
#DB_HOST=127.0.0.1
#DB_PORT=3307


# Configuracao do banco de dados
spring.datasource.url=jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_HOST_PORT:3306}/gerenciar_pedido?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=America/Sao_Paulo&allowPublicKeyRetrieval=true
spring.jpa.properties.hibernate.default_schema=gerenciar_pedido
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
#logging.level.org.springframework.security=TRACE

# Configuracao do JPA/Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
logging.level.org.hibernate.SQL=DEBUG

#granularidade do log do HikariCP
#logging.level.com.zaxxer.hikari.HikariConfig=DEBUG
#logging.level.com.zaxxer.hikari=TRACE 

logging.level.org.springframework.jdbc=DEBUG

# Opcional: Configuracao do pool de conexoes (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari=DEBUG

spring.jackson.date-format=dd/MM/yyyy
spring.jackson.time-zone=America/Sao_Paulo

spring.boot.multipart.enabled=true
spring.boot.multipart.file-size-threshold=2MB
spring.boot.multipart.max-file-size=10MB
spring.boot.multipart.max-request-size=10MB
#spring.boot.multipart.location=/tmp
file.upload-dir=/D/projetos/upload-arquivos/registro-operacoes