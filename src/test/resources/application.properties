spring.application.name=gerenciar-pedido

#server.servlet.context-path=/gerenciar-pedido/api/v1
#server.port=${SERVER_HOST_PORT:8080}

#DB_HOST=host.docker.internal
#DB_HOST=127.0.0.1
#DB_PORT=3307


# Configuracao do banco de dados
# Configuração de exemplo para banco de dados H2 em testes
spring.datasource.url=jdbc:h2:mem:gerenciar_pedido;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Configurações do JPA/Hibernate para testes
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop


# Configuracao do JPA/Hibernate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG

#granularidade do log do HikariCP
#logging.level.com.zaxxer.hikari.HikariConfig=DEBUG
#logging.level.com.zaxxer.hikari=TRACE 

logging.level.org.springframework.jdbc=DEBUG

# Opcional: Configuracao do pool de conexoes (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari=DEBUG


logging.level.org.springframework.boot.autoconfigure=ERROR